# CI for a PHP project. Installed by `framework/bin/fw workflow install ci-php` into
# .github/workflows/ci-php.yml. It runs the commands of .fw/config.json → commands through
# `fw check`, so CI and the agents always run the same thing: change a command there, not here.
# The job is named `check`: make it required with `framework/bin/fw protect --checks check`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: "mbstring, intl, pdo_mysql"   # comma-separated, as for shivammathur/setup-php

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer
          coverage: none
      - name: Install dependencies
        run: framework/bin/fw check install --if-configured
      - name: Lint, type-check, test, build (.fw/config.json → commands)
        run: framework/bin/fw check
