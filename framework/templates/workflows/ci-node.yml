# CI for a Node.js project. Installed by `framework/bin/fw workflow install ci-node` into
# .github/workflows/ci-node.yml. It runs the commands of .fw/config.json → commands through
# `fw check`, so CI and the agents always run the same thing: change a command there, not here.
# The job is named `check`: make it required with `framework/bin/fw protect --checks check`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: ""   # empty = read .nvmrc / .node-version / package.json "engines"; or e.g. "22"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          node-version-file: ${{ env.NODE_VERSION == '' && (hashFiles('.nvmrc') != '' && '.nvmrc' || hashFiles('.node-version') != '' && '.node-version' || 'package.json') || '' }}
      - name: Install dependencies
        run: framework/bin/fw check install --if-configured
      - name: Lint, type-check, test, build (.fw/config.json → commands)
        run: framework/bin/fw check
