name: Bug
description: Something does not work as expected
labels: ["bug", "triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, screenshots, logs (no secrets)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: browser / OS / version / URL
